  <script>
    // The form posts to /api/contact, which sends it on as one email.
    (function () {
      const form = document.getElementById("contact-form");
      const status = document.getElementById("contact-status");
      const send = document.getElementById("contact-send");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = form.email.value.trim();
        const message = form.message.value.trim();
        if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) { status.textContent = "An email address is needed for the reply."; form.email.focus(); return; }
        if (message.length < 10) { status.textContent = "Say a little more than that."; form.message.focus(); return; }
        send.disabled = true;
        status.textContent = "Sending…";
        try {
          const r = await fetch("/api/contact", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: form.name.value.trim(), email, message, website: form.website.value }) });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
          form.reset();
          status.textContent = "Sent. You'll hear back at that address.";
        } catch (err) {
          status.textContent = `Not sent: ${err.message}. The email address above works too.`;
        } finally {
          send.disabled = false;
        }
      });
    })();
  </script>
