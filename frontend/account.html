<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Google tag (gtag.js). Google's own instruction is "immediately
       after <head>"; it sits after the charset instead, because a
       document's encoding has to be declared inside the first 1024
       bytes and this snippet is long enough to push it out. async, so
       it never blocks the theme script below or first paint. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GXP63R1JP1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GXP63R1JP1');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenTechJobs: Account</title>
  <meta name="description" content="Your saved alerts, the skills you want matched, and what we store about you." />
  <!-- Link preview, same card as the board: a pasted link to any page
       shows the site, not a blank. Absolute URLs, for crawlers. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://opentechjobs.org/account" />
  <meta property="og:title" content="OpenTechJobs: Account" />
  <meta property="og:description" content="Your saved alerts, the skills you want matched, and what we store about you." />
  <meta property="og:image" content="https://opentechjobs.org/og-hills.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OpenTechJobs: Account" />
  <meta name="twitter:description" content="Your saved alerts, the skills you want matched, and what we store about you." />
  <meta name="twitter:image" content="https://opentechjobs.org/og-hills.jpg" />
  <!-- No og: tags and noindex: this page is only meaningful signed in,
       and a shared link to it would show a stranger their own empty
       account rather than anything worth previewing. -->
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
  <link rel="icon" href="favicon.ico?v=2" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png?v=2" />
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem("iljobs_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
</head>
<body>

  <div class="topbar">
    <div class="container">
      <nav class="topnav">
        <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>
        <a class="link" href="/board">Job board</a>
        <a class="link" href="/stats">Explore</a>
        <a class="link" href="/api/help">API</a>
      </nav>
    </div>
  </div>

  <div class="workspace">
    <section class="section">
      <div class="container account-page">
        <h2 class="section-title">Account</h2>

        <!-- Signed out: the whole page is one sign-in, because every
             section below needs a token to say anything at all. Its own
             ids (acct-*), not the board topbar panel's, so the two can
             coexist; the handlers behind them are app.js's, shared. -->
        <div id="account-signedout" class="signin-scrim" hidden>
         <div class="signin-dialog" role="dialog" aria-modal="true" aria-labelledby="signin-title">
          <h3 class="account-block-title" id="signin-title">Sign in</h3>
          <button class="auth-provider-btn" id="acct-google" type="button">
            <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.348 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
            <span>Continue with Google</span>
          </button>
          <button class="auth-provider-btn" id="acct-github" type="button">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span>Continue with GitHub</span>
          </button>
          <div class="auth-divider">or</div>
          <form class="auth-email-form" id="acct-email-form">
            <input type="email" id="acct-email-input" placeholder="you@example.com" required autocomplete="email" />
            <button class="btn" type="submit">Send code</button>
          </form>
          <form class="auth-email-form" id="acct-otp-form" hidden>
            <input type="text" id="acct-otp-input" placeholder="Verification code" inputmode="numeric" pattern="[0-9]{4,10}" required autocomplete="one-time-code" />
            <button class="btn" type="submit">Verify</button>
          </form>
          <p class="auth-error" id="acct-error" hidden></p>
         </div>
        </div>

        <div id="account-body" hidden>
          <section class="account-block">
            <div class="account-block-head">
              <h3 class="account-block-title">Signed in as</h3>
            </div>
            <p class="account-email" id="account-email"></p>
          </section>

          <section class="account-block" id="cv">
            <div class="account-block-head">
              <h3 class="account-block-title">CV analyser</h3>
            </div>

            <div class="cv-drop" id="cv-drop">
              <input type="file" id="cv-file" accept=".pdf,.txt,.md,application/pdf,text/plain" hidden />
              <button class="btn btn-small" id="cv-analyze" type="button">Analyze CV</button>
              <span class="cv-filename" id="cv-filename">PDF or plain text</span>
            </div>
            <p class="cv-status" id="cv-status" aria-live="polite"></p>

            <div id="cv-result" hidden>
              <p class="account-label">Skills found</p>
              <div class="cv-chips" id="cv-chips"></div>
              <div class="account-actions">
                <button class="btn btn-small" id="profile-save" type="button">Save to profile</button>
                <a class="btn ghost btn-small" id="profile-matches" href="/board">See matches</a>
                <span class="account-status" id="profile-status" aria-live="polite"></span>
              </div>
            </div>
          </section>

          <!-- The listings this reader starred, from any device. They used
               to live only in one browser's localStorage, so this section
               could not have existed. -->
          <section class="account-block">
            <div class="account-block-head">
              <h3 class="account-block-title">Saved listings</h3>
              <span class="account-hint">Starred on any device</span>
            </div>
            <div id="saved-list"><p class="alerts-empty">Loading…</p></div>
          </section>

          <!-- Same ids as the board's own alert panel, so app.js's
               renderAlertsList and wireAlertCreateForm drive this page
               too rather than a second implementation of the same form. -->
          <section class="account-block">
            <div class="account-block-head">
              <h3 class="account-block-title">Alerts</h3>
              <span class="account-hint">Emailed when a new listing matches</span>
            </div>
            <div id="alerts-list"><p class="alerts-empty">Loading…</p></div>

            <div class="alert-create" id="alert-create">
              <div class="alerts-header" id="alert-form-title">New Alert</div>
              <div class="alert-create-fields">
                <input type="text" id="alert-f-search" placeholder="SEARCH" />
                <div class="ms" id="alert-ms-department"></div>
                <div class="ms" id="alert-ms-seniority"></div>
                <div class="ms" id="alert-ms-company"></div>
                <div class="ms" id="alert-ms-location"></div>
                <div class="ms" id="alert-ms-workplace"></div>
              </div>
              <div class="alert-form-actions">
                <button class="btn" id="create-alert-btn" type="button">Create Alert</button>
                <button class="btn btn-quiet" id="cancel-edit-btn" type="button" hidden>Cancel</button>
              </div>
              <p class="create-alert-feedback" id="create-alert-feedback" hidden></p>
            </div>
          </section>

          <section class="account-block">
            <div class="account-actions">
              <button class="btn ghost btn-small" id="account-signout" type="button">Sign out</button>
              <button class="btn ghost btn-small btn-danger" id="account-delete" type="button">Delete Account</button>
              <button class="btn btn-small btn-danger-solid" id="account-delete-confirm" type="button" hidden>Confirm</button>
              <span class="account-status" id="account-status" aria-live="polite"></span>
            </div>
          </section>
        </div>
      </div>
    </section>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="cv_skills.js"></script>
  <script src="account.js"></script>
  <script src="mobile_nav.js"></script>
</body>
</html>
