niloosoft:
  # Niloosoft's Hunter, the ATS behind most of Israel's large traditional
  # employers. Nothing about a board is guessable from the company: it
  # lives on <tenant>.hunterhrms.com, renders in the browser, and posts
  # to one shared API that routes by a per-tenant path. Iscar's board is
  # iscar-fr and posts to actions-iscar-hamah; Elbit's is elbitnew and
  # posts to actions-elbit.
