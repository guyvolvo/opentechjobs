#   "Guideline" (comeet.com/jobs/guideline) is a US 401(k) provider,
#   unrelated to Israel: a coincidental token match, not a company to add.

# Workday needs the same hand-pinning as Comeet above, for a different
# reason: it's not guess-and-verify-able the way Greenhouse/Lever/etc are
# (see probe.py's resolve(), the comment right above where this file's
# "workday" key gets read). tenant/wd/site found by locating the
# company's own real careers page and reading the myworkdayjobs.com URL
# it links to, then verified live with f_workday before adding here --
# same discipline as every domains.txt batch, just for a token instead
# of a plain domain.
#
# israel_facets, where present: this tenant's own Israel-labeled
# location facet id(s), from discover_workday_israel_facets() (probe.py)
# -- there's no shared id across tenants (each Workday deployment is a
# fully separate company database, confirmed live: NVIDIA's id silently
# no-ops on Cisco's tenant instead of erroring), so this has to be
# discovered and cached per company, same as tenant/wd/site above. Lets
# f_workday scope every fetch to just this company's Israel postings
# instead of its full global list, so the existing WORKDAY_MAX_JOBS cap
# covers up to that many *relevant* jobs instead of whatever Workday's
# unfiltered default ordering happens to return -- reported live, that
# gap is exactly how a real NVIDIA Israel posting went missing. Verified
# against a real query (not just "a facet with 'israel' in it exists")
# before being added: appliedmaterials.com's own "locations" facet
# looked like a match but returned an incomplete, wrong result --
# "Country" is the one that's actually correct there. No entry means
# either not yet discovered or a genuine, confirmed-empty current
# Israel presence (ebay.com, broadcom.com, visa.com, paypal.com) -- an
# empty facet filter is a no-op, same as not passing one at all, so
# there's nothing useful to cache for those.
workday:
  - domain: nvidia.com
    tenant: nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
    source: hand-verified
    note: nvidia.com itself also guesses a false-positive workable:nvidia hit (an unrelated, empty tenant) -- see KNOWN_FALSE_POSITIVES in probe.py
    israel_facets: {locationHierarchy1: ["2fcb99c455831013ea52bbe14cf9326c"]}

  - domain: paloaltonetworks.com
    tenant: paloaltonetworks
    wd: wd5
    site: panwexternalcareers
    source: hand-verified
    israel_facets: {locations: ["45eb6188f3f71001f08639efd22e0000", "45eb6188f3f71001f086499c91d00000", "bafc965434591001f0472e9b5bfa0000", "91e39ca70dc31059f344108791f2c199", "462d9b819ff31060221ce2cad22df7c3", "b3c4c0c99c0e10015b7a8c51c0490000", "d70273bbce1a1000e4f5ff6c866d0000", "5aa443c785ff10455f18842696b339e7"]}

