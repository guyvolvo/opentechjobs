# Hand-pinned ATS entries that guess-and-verify cannot recover on its own.
#
# Comeet needs an opaque per-company `token` plus a `uid`, neither
# derivable from the domain (see probe.py's f_comeet_scrape docstring).
# probe.py's scraper recovers this automatically for companies that embed
# Comeet via the WordPress plugin (token/uid land server-side in the
# careers page HTML). aquasec.com and silverfort.com below were found
# that way and are listed here only for the record.
#
# Everything else here was recovered by hand: search-engine-indexed
# comeet.com/jobs/{slug}/{uid} URLs, fetched, with the real opaque token
# scraped out of the embedded `"company_uid":"...","token":"..."` JSON on
# that page. This is the "extract pairs by hand" path the project brief
# called out as the alternative to a Common Crawl comeet.co harvest,
# scoped to what a couple hours of search-engine spelunking turns up, not
# an exhaustive sweep. `jobs_seen` is the count at extraction time
# (2026-08-06), for sanity-checking later, not a live figure.
#
# uid/token are query-string credentials for a public, unauthenticated
# read endpoint (equivalent to a Greenhouse board token), not a secret
# in the API-key sense, but treat them as opaque IDs, not as proof a
# company endorses this project.
#
# API shape: GET https://www.comeet.com/careers-api/1.0/company/{uid}/positions?token={token}

comeet:
  - domain: aquasec.com
    uid: "91.001"
    token: "191644966966644E194B3191644644"
    jobs_seen: 6
    source: wp-plugin-scrape

