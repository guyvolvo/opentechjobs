  # Both halves are recoverable, and discover_niloosoft.py does it:
  # certificate transparency on hunterhrms.com is the tenant list, and
  # the action path is a literal in each board's own JavaScript bundle.
  # Everything below came from one run over all 117 hosts on
  # 2026-09-11. 56 of those no longer serve and 42 run an older
  # WordPress board with no equivalent endpoint.
