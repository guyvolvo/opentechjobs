# discovered and cached per company, same as tenant/wd/site above. Lets
# f_workday scope every fetch to just this company's Israel postings
# instead of its full global list, so the existing WORKDAY_MAX_JOBS cap
# covers up to that many *relevant* jobs instead of whatever Workday's
# unfiltered default ordering happens to return -- reported live, that
# gap is exactly how a real NVIDIA Israel posting went missing. Since
# 2026-09-21 the global list is fetched in full up to a 3,000 cap and the
# facets only top up a tenant past it, so no Israel posting falls past
# the end either way. Verified
