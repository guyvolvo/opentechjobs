name: scrape-discover

# The SLOW pipeline: full guess-and-verify against every ATS, plus the
# Comeet and embed/JSON-LD fallbacks, across every domain in domains.txt.
# Hours, not minutes. That's why it doesn't run on scrape-fast.yml's
# cadence, since a company's ATS platform doesn't change minute to minute.
#
# Two things bound how long it runs, both added when the Pvalyou seed
# list took domains.txt from 12,088 domains to 15,602 (see the block
# comment in that file). Neither is a tuning knob; without them this job
# hits GitHub's 6-hour cap and writes nothing at all.
#
# --guess-shard rotates the expensive work. A domain that already
# resolved costs one hinted request; a domain that never has costs
# probe.py's whole 45-second search and then two careers-page scrapes.
# So only the guessing is divided, over four days, and every known
# company is still re-polled every night. The cost of that: a brand new
# domain waits up to four days for its first probe instead of one.
# Worth it, and invisible next to the weeks a domain typically sits in
# this file before anyone notices it resolved.
#
# --deadline-minutes is the floor under that. Whatever the shard turns
# out to contain, probing stops at four hours and every domain not
# reached comes back retryable, which the loader reads as no evidence
# and leaves alone. The run then loads and pushes what it did get. This
# is the difference between a short night and a lost one: on
# 2026-09-09 through 2026-09-11 the sweep probed everything and then
# died before its first write, so three days of discovery landed nothing.
#
# Once a company resolves here, scrape-fast.yml re-polls it directly from
# then on (see loader.py's export_known(), which re-derives known.json
# every load so the next fast-poll run picks up new discoveries immediately).
#
# workflow_dispatch's `domains` input: a targeted re-resolve of one or a
# few specific companies (comma/space-separated), instead of the full
# ~450-domain sweep. Reported live, repeatedly: fixing/onboarding one
# company (a new pin, a resolver bugfix) had no way to verify or land
# without waiting for tomorrow's cron or running the entire batch by
# hand -- for one domain that's a ~20-minute, 450-company-wide operation
# to check a single line. Safe to run anytime now, even overlapping the
# full sweep or scrape-fast (see s3_push_conditional in load_to_sqlite.py)
# -- no more risk of one write silently clobbering the other. Skips
# --prune-stale: that flag's whole premise is "this run's domain list is
# the complete set to compare against," which a handful of domains isn't.
#
# Finding NEW company domains to ADD to domains.txt is a separate,
# still-manual process, not built yet.

on:
  schedule:
    - cron: "17 3 * * *" # once/day, offset from midnight UTC
  workflow_dispatch:
    inputs:
      domains:
        description: "Optional: comma/space-separated domain(s) to re-resolve, instead of the full domains.txt sweep"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: il-central-1

jobs:
  discover:
    runs-on: ubuntu-latest
    # Above --deadline-minutes below plus the load, and below the 6-hour
    # default. Stated rather than inherited so that if this job ever does
    # run long, the log says which limit stopped it.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Moved ahead of the probe step (it used to run after) specifically
      # so status.json can report "discovering" for the ~20-minute full
      # sweep, not just "idle" the whole time it's actually running --
      # see api/handler.py's route_pipeline_status and this file's other
      # status-writing steps below. Python + boto3, not raw `aws s3 cp`
      # with a shell-quoted JSON body -- already installed for this
      # workflow's other steps, and not worth the quoting fragility.
      - name: "Report status: discovering"
        env:
          DOMAINS_INPUT: ${{ github.event.inputs.domains }}
        run: |
          python -c "
          import json, os, boto3
          from datetime import datetime, timezone
          domains = os.environ.get('DOMAINS_INPUT') or ''
          detail = f'targeted re-resolve: {domains}' if domains else 'full domains.txt sweep'
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'discovering', 'run': 'discover', 'detail': detail,
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      # Hints: what each domain resolved to last time. Without them the
      # sweep re-derives every already-known company from scratch,
      # walking every fetcher and then two careers-page scrapes. Absent
      # on a first run, which is not an error: probe.py says so and
      # guesses from scratch.
      - name: Pull known.json for hints
        # A second copy, because the load step below writes its own export
        # over known.json. The load compares the live file against this one
        # to keep companies added while the sweep was running.
        run: |
          aws s3 cp "s3://${{ vars.DATA_BUCKET }}/known.json" known.json || true
          [ -f known.json ] && cp known.json known-at-start.json || true

      # 10# on the day number, because `date +%j` zero-pads and bash
      # reads 008 and 009 as bad octal. Day-of-year and not the run
      # number so the rotation stays predictable across re-runs and
      # manual dispatches.
      - name: Full probe, guess, Comeet scrape, embed/JSON-LD fallback
        if: ${{ github.event.inputs.domains == '' }}
        run: |
          shard=$(( 10#$(date -u +%j) % 4 ))
          python probe.py --batch domains.txt --hints known.json --fetch-descriptions \
            --guess-shard "$shard/4" --deadline-minutes 240 --json > resolved.json

      # No --guess-shard here, deliberately. The point of a targeted
      # dispatch is to probe the domains you asked for, now; deferring
      # three of every four of them to a later run would answer a
      # different question than the one being asked.
      - name: Targeted probe (workflow_dispatch domains input)
        if: ${{ github.event.inputs.domains != '' }}
        run: python probe.py --domain "${{ github.event.inputs.domains }}" --hints known.json --fetch-descriptions --json > resolved.json

      # The credentials above are an OIDC session on a role capped at one
      # hour, and the sweep above outgrew that: it took 23 minutes on
      # 2026-09-07 and 3h40m on 2026-09-11. Every run since 2026-09-09
      # probed all 4,271 domains successfully and then died on its first
      # S3 write with ExpiredToken, so three days of discovery resolved
      # nothing. Re-assume here rather than raise the role's session
      # limit: the long step needs no credentials at all, and a fresh
      # hour for the writes is both sufficient and shorter-lived.
      - name: Re-assume AWS credentials (the probe above outlives them)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Report hit rate
        run: |
          python -c "
          import json
          data = json.load(open('resolved.json', encoding='utf-8'))
          hits = [r for r in data if r.get('ats')]
          deferred = [r for r in data if not r.get('ats') and r.get('retryable')
                      and 'shard' in (r.get('error') or '')]
          late = [r for r in data if not r.get('ats') and r.get('retryable')
                  and 'deadline' in (r.get('error') or '')]
          by_ats = {}
          for r in hits:
              by_ats[r['ats']] = by_ats.get(r['ats'], 0) + 1
          print(f'{len(hits)}/{len(data)} resolved')
          print(f'  {len(deferred)} left to another shard, {len(late)} cut off by the deadline')
          for a, n in sorted(by_ats.items(), key=lambda kv: -kv[1]):
              print(f'  {a:<18} {n}')
          print(f'  total jobs      {sum(r[\"job_count\"] for r in hits)}')
          "

      - name: "Report status: loading"
        run: |
          python -c "
          import json, boto3
          from datetime import datetime, timezone
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'loading', 'run': 'discover', 'detail': 'writing to jobs-full-discover.db',
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      # --skip-known on a targeted run, for the same reason a partition
      # writer passes it: this DB then holds only the handful of domains
      # that were asked for, and export_known() against it produces a
      # known.json missing every other company. Done live on 2026-09-11 by
      # a six-domain re-resolve, which took the global file from 3,635
      # companies to 6 and had to be restored from a bucket version. The
      # full sweep still exports, because only it has seen everything.
      #
      # jobs-full-discover.db, not jobs.db: Partition & Merge (2026-09-08)
      # retired the shared jobs.db -- see scrape_handler.py's own
      # docstring. This run's own working DB doesn't fit either partition
      # shape (not one fixed shard, not a stable pinned list) and, unlike
      # merge_discovered_batch.py's own partial batches, doesn't need to:
      # it re-probes the WHOLE of domains.txt every time, so export_known()
      # and --prune-stale here are already wholesale-correct against
      # whatever this run just resolved, regardless of what the previous
      # snapshot under this key looked like. This key is never listed by
      # loader/merge_partitions.py (only jobs-partition-* is), so it can
      # never end up in jobs-read.db or collide with a shard's own data --
      # its only job is giving --prune-stale/export_known a working copy
      # to run against, same role jobs.db used to serve for this one
      # workflow specifically.
      - name: Load into jobs-full-discover.db, re-derive known.json, push both to S3
        run: |
          python loader/load_to_sqlite.py \
            --resolved resolved.json \
            --out jobs-full-discover.db \
            --bucket ${{ vars.DATA_BUCKET }} \
            --key jobs-full-discover.db \
            ${{ github.event.inputs.domains == '' && '--prune-stale --demote-empty-days 3 --known-baseline known-at-start.json' || '--skip-known' }}

      # A targeted run still has to reach the fast poll, which reads only
      # known.json. --skip-known above stops the wholesale replace that
      # wiped the file on 2026-09-11, and on its own that also meant a
      # re-resolved company waited for tomorrow's full sweep. Seven
      # companies pinned on 2026-09-14 resolved here and stayed off the
      # board for exactly that reason. So this upserts just this run's
      # hits by domain, the way merge_discovered_batch.py does, and every
      # other company in the file is left alone.
      - name: Upsert this run's resolved companies into known.json
        if: ${{ github.event.inputs.domains != '' }}
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
        run: |
          python -c "
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'loader')
          sys.path.insert(0, 'api')
          from load_to_sqlite import s3_pull, s3_push
          hits = [r for r in json.load(open('resolved.json', encoding='utf-8')) if r.get('ats')]
          if not hits:
              print('nothing resolved, known.json untouched')
              raise SystemExit(0)
          bucket = os.environ['DATA_BUCKET']
          path = Path('known-targeted.json')
          existed, _ = s3_pull(bucket, 'known.json', path)
          if not existed:
              print('known.json not in S3, leaving it for the full sweep to create')
              raise SystemExit(0)
          known = json.loads(path.read_text(encoding='utf-8'))
          before = len(known)
          by_domain = {e['domain']: e for e in known}
          for r in hits:
              by_domain[r['domain']] = {'domain': r['domain'], 'ats': r['ats'], 'token': r.get('token')}
          merged = list(by_domain.values())
          # The same guard in the other direction: an upsert can only grow
          # the file or keep its size. Anything smaller means a bad pull.
          assert len(merged) >= before, (len(merged), before)
          path.write_text(json.dumps(merged, ensure_ascii=False), encoding='utf-8')
          s3_push(bucket, 'known.json', path)
          print(f'upserted {len(hits)} companies into known.json ({before} -> {len(merged)})')
          "

      - name: "Report status: idle"
        run: |
          python -c "
          import json, boto3
          from datetime import datetime, timezone
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'idle', 'run': 'discover', 'detail': 'discover run finished',
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      # Only runs if an earlier step actually failed (default step
      # behavior skips on failure) -- without this, a failed run would
      # leave status.json stuck reporting "loading"/"discovering"
      # forever, reading as "still running" long after it's dead.
      - name: "Report status: error"
        if: failure()
        run: |
          python -c "
          import json, boto3
          from datetime import datetime, timezone
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'error', 'run': 'discover', 'detail': 'discover run failed, see the Actions log',
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      - name: Upload resolved.json as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resolved-json
          path: resolved.json
          retention-days: 14
