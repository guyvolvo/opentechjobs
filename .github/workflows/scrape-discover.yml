name: scrape-discover

# The SLOW pipeline: full guess-and-verify against every ATS, plus the
# Comeet and embed/JSON-LD fallbacks, across every domain in domains.txt.
# Minutes, not seconds (~10-15 min over ~350 domains). That's why it
# doesn't run on scrape-fast.yml's cadence, since a company's ATS
# platform doesn't change minute to minute.
#
# Once a company resolves here, scrape-fast.yml re-polls it directly from
# then on (see loader.py's export_known(), which re-derives known.json
# every load so the next fast-poll run picks up new discoveries immediately).
#
# workflow_dispatch's `domains` input: a targeted re-resolve of one or a
# few specific companies (comma/space-separated), instead of the full
# ~450-domain sweep. Reported live, repeatedly: fixing/onboarding one
# company (a new pin, a resolver bugfix) had no way to verify or land
# without waiting for tomorrow's cron or running the entire batch by
# hand -- for one domain that's a ~20-minute, 450-company-wide operation
# to check a single line. Safe to run anytime now, even overlapping the
# full sweep or scrape-fast (see s3_push_conditional in load_to_sqlite.py)
# -- no more risk of one write silently clobbering the other. Skips
# --prune-stale: that flag's whole premise is "this run's domain list is
# the complete set to compare against," which a handful of domains isn't.
#
# Finding NEW company domains to ADD to domains.txt is a separate,
# still-manual process, not built yet.

on:
  schedule:
    - cron: "17 3 * * *" # once/day, offset from midnight UTC
  workflow_dispatch:
    inputs:
      domains:
        description: "Optional: comma/space-separated domain(s) to re-resolve, instead of the full domains.txt sweep"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: il-central-1

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Moved ahead of the probe step (it used to run after) specifically
      # so status.json can report "discovering" for the ~20-minute full
      # sweep, not just "idle" the whole time it's actually running --
      # see api/handler.py's route_pipeline_status and this file's other
      # status-writing steps below. Python + boto3, not raw `aws s3 cp`
      # with a shell-quoted JSON body -- already installed for this
      # workflow's other steps, and not worth the quoting fragility.
      - name: "Report status: discovering"
        env:
          DOMAINS_INPUT: ${{ github.event.inputs.domains }}
        run: |
          python -c "
          import json, os, boto3
          from datetime import datetime, timezone
          domains = os.environ.get('DOMAINS_INPUT') or ''
          detail = f'targeted re-resolve: {domains}' if domains else 'full domains.txt sweep'
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'discovering', 'run': 'discover', 'detail': detail,
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      - name: Full probe, guess, Comeet scrape, embed/JSON-LD fallback
        if: ${{ github.event.inputs.domains == '' }}
        run: python probe.py --batch domains.txt --fetch-descriptions --json > resolved.json

      - name: Targeted probe (workflow_dispatch domains input)
        if: ${{ github.event.inputs.domains != '' }}
        run: python probe.py --domain "${{ github.event.inputs.domains }}" --fetch-descriptions --json > resolved.json

      - name: Report hit rate
        run: |
          python -c "
          import json
          data = json.load(open('resolved.json', encoding='utf-8'))
          hits = [r for r in data if r.get('ats')]
          by_ats = {}
          for r in hits:
              by_ats[r['ats']] = by_ats.get(r['ats'], 0) + 1
          print(f'{len(hits)}/{len(data)} resolved')
          for a, n in sorted(by_ats.items(), key=lambda kv: -kv[1]):
              print(f'  {a:<18} {n}')
          print(f'  total jobs      {sum(r[\"job_count\"] for r in hits)}')
          "

      - name: "Report status: loading"
        run: |
          python -c "
          import json, boto3
          from datetime import datetime, timezone
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'loading', 'run': 'discover', 'detail': 'writing to jobs-full-discover.db',
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      # jobs-full-discover.db, not jobs.db: Partition & Merge (2026-09-08)
      # retired the shared jobs.db -- see scrape_handler.py's own
      # docstring. This run's own working DB doesn't fit either partition
      # shape (not one fixed shard, not a stable pinned list) and, unlike
      # merge_discovered_batch.py's own partial batches, doesn't need to:
      # it re-probes the WHOLE of domains.txt every time, so export_known()
      # and --prune-stale here are already wholesale-correct against
      # whatever this run just resolved, regardless of what the previous
      # snapshot under this key looked like. This key is never listed by
      # loader/merge_partitions.py (only jobs-partition-* is), so it can
      # never end up in jobs-read.db or collide with a shard's own data --
      # its only job is giving --prune-stale/export_known a working copy
      # to run against, same role jobs.db used to serve for this one
      # workflow specifically.
      - name: Load into jobs-full-discover.db, re-derive known.json, push both to S3
        run: |
          python loader/load_to_sqlite.py \
            --resolved resolved.json \
            --out jobs-full-discover.db \
            --bucket ${{ vars.DATA_BUCKET }} \
            --key jobs-full-discover.db \
            ${{ github.event.inputs.domains == '' && '--prune-stale' || '' }}

      - name: "Report status: idle"
        run: |
          python -c "
          import json, boto3
          from datetime import datetime, timezone
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'idle', 'run': 'discover', 'detail': 'discover run finished',
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      # Only runs if an earlier step actually failed (default step
      # behavior skips on failure) -- without this, a failed run would
      # leave status.json stuck reporting "loading"/"discovering"
      # forever, reading as "still running" long after it's dead.
      - name: "Report status: error"
        if: failure()
        run: |
          python -c "
          import json, boto3
          from datetime import datetime, timezone
          boto3.client('s3').put_object(
              Bucket='${{ vars.DATA_BUCKET }}', Key='status.json', ContentType='application/json',
              Body=json.dumps({'phase': 'error', 'run': 'discover', 'detail': 'discover run failed, see the Actions log',
                                'at': datetime.now(timezone.utc).isoformat(timespec='seconds')}).encode(),
          )
          "

      - name: Upload resolved.json as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resolved-json
          path: resolved.json
          retention-days: 14
