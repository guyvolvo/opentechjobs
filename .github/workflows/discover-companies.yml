name: discover-companies

# Keeps pending-discovery-candidates.json topped up on its own -- see
# refresh_discovery_queue.py's own docstring for why this exists:
# discover_companies.py originally only ever ran once, by hand
# (2026-09-07); once that one-time batch drained, discovery would stop
# for good with nothing left to feed merge-discovered-companies.yml.
#
# Daily, not more often: Common Crawl publishes a new crawl snapshot
# roughly monthly, so running this hourly wouldn't find meaningfully
# more than running it daily -- it would just re-check the same
# snapshot and find nothing new most of the time. Daily is enough to
# pick up a new snapshot promptly without wasting runs.
#
# No schedule: trigger -- GitHub's own cron scheduler doesn't reliably
# fire on this repo (confirmed live 2026-09-08 for
# merge-discovered-companies.yml's own cron; see that workflow's own
# comment). infra/dispatch_workflow_lambda.tf's EventBridge rule calls
# workflow_dispatch below once a day instead.

on:
  workflow_dispatch: {}

# Same reasoning as merge-discovered-companies.yml's own concurrency
# block -- this one's daily cadence makes an overlap far less likely,
# but a manual test trigger landing near the scheduled one is exactly
# the shape of thing that already happened to the other workflow.
concurrency:
  group: discover-companies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Refresh the discovery queue
        run: python refresh_discovery_queue.py

      - name: Commit queue changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending-discovery-candidates.json
          git diff --cached --quiet && echo "nothing changed this run" && exit 0
          git commit -m "Refresh discovery queue with newly found companies"
          # Same race merge-discovered-companies.yml hit on 2026-09-16, and
          # worse here: this run takes ten minutes of CDX requests across
          # three crawl snapshots, so the window for someone else to push is
          # wide, and losing it throws away the whole discovery pass.
          #
          # -X theirs keeps this run's queue on conflict. In a rebase "theirs"
          # is the commit being replayed, which is ours in the everyday sense;
          # the names read backwards and this was checked rather than assumed.
          # A merge running alongside will have popped candidates off the
          # front of the queue while this rebuilt it from scratch, so neither
          # version is a superset. This one carries the newly discovered
          # companies, which is what another full CDX pass would be needed to
          # recover.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "push still rejected after 3 attempts" >&2
          exit 1
