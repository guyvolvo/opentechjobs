name: deploy-infra

# Terraform for infra/ (S3 buckets, Lambda, CloudFront, GitHub OIDC
# roles). PRs get a plan for review; only pushes to the deploy branch can
# apply -- enforced both here and by the infra-deploy OIDC role's trust
# policy on the AWS side.
#
# Does NOT touch infra/bootstrap/ -- a one-time, apply-by-hand step (see
# its own header) that creates the state bucket this workflow depends on.
#
# Bootstrapping order: this workflow authenticates via the infra-deploy
# OIDC role, but that role is created BY this same Terraform config. The
# very first apply has no role to assume yet and must run locally:
#   cd infra && terraform init && terraform apply
# Only then do the *_DEPLOY_ROLE_ARN outputs exist to paste into the
# repo's Settings -> Actions -> Variables -- after that, this workflow
# and the others can run unattended.

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write # to comment the plan on the PR

env:
  AWS_REGION: il-central-1
  TF_VERSION: "1.10.5"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -no-color -out=tfplan | tee plan.txt

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### terraform plan\n```\n" + plan + "\n```",
            });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform apply -auto-approve
