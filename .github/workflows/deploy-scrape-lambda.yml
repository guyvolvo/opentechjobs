name: deploy-scrape-lambda

# Ships probe.py + loader/ to all three scrape Lambdas without a full
# Terraform apply, mirroring deploy-api.yml. Terraform owns each
# function's existence/config, this workflow owns their code.
#
# Three separate packages, not one shared zip: scrape-fast needs
# scrape_handler.py + alerts.py + sharding.py (DynamoDB/SES access, the
# fast-poll's own known.json-driven --known path, sharded -- see that
# handler's own docstring); scrape-workday needs
# scrape_workday_handler.py + companies.yml (its own company list comes
# from probe.py's PINS, not S3's known.json -- see that handler's own
# docstring for why it's a separate function at all, and why it needs no
# sharding.py: a pinned company list has no shard concept); scrape-
# maintenance needs scrape_maintenance_handler.py + loader/
# merge_partitions.py + sharding.py (no probe.py, no companies.yml -- it
# never resolves anything itself, just merges every writer's own
# partition file -- see that handler's own docstring). All three share
# loader/load_to_sqlite.py, job_filters.py, schema.sql, and requests
# underneath.

on:
  push:
    branches: [main]
    paths:
      - "probe.py"
      - "loader/**"
      - "db/schema.sql"
      - "scrape_handler.py"
      - "scrape_workday_handler.py"
      - "scrape_maintenance_handler.py"
      - "sharding.py"
      - "alerts.py"
      - "api/job_filters.py"
      - "companies.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: il-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build scrape-fast package
        run: |
          mkdir -p fast/loader fast/db
          cp probe.py scrape_handler.py alerts.py sharding.py salary_model.py fast/
          cp api/job_filters.py fast/
          cp loader/load_to_sqlite.py loader/descriptions.py loader/deltas.py fast/loader/
          cp db/schema.sql fast/db/
          pip install --target fast requests
          cd fast && zip -r ../scrape-fast.zip . -x "__pycache__/*" && cd ..

      - name: Build scrape-workday package
        run: |
          mkdir -p workday/loader workday/db
          cp probe.py scrape_workday_handler.py companies.yml salary_model.py workday/
          cp api/job_filters.py workday/
          cp loader/load_to_sqlite.py loader/descriptions.py loader/deltas.py workday/loader/
          cp db/schema.sql workday/db/
          # pyyaml, not just requests: this is the one deployment package
          # that actually needs probe.py's companies.yml reading to work
          # (PINS is silently empty otherwise -- probe.py's own `import
          # yaml` falls back to None on ImportError, and load_pins()
          # treats that the same as a genuinely missing file. Reported
          # live: the first deploy of this Lambda did exactly that).
          # pyyaml carries a compiled extension, so the wheel has to match
          # the Lambda's architecture rather than the runner's. requests is
          # pure Python and does not care, but this installs both together.
          pip install --target workday --platform manylinux2014_aarch64 \n            --implementation cp --python-version 3.13 --only-binary=:all: \n            requests pyyaml
          cd workday && zip -r ../scrape-workday.zip . -x "__pycache__/*" && cd ..

      - name: Build scrape-maintenance package
        run: |
          mkdir -p maintenance/loader maintenance/db
          cp scrape_maintenance_handler.py sharding.py maintenance/
          cp loader/load_to_sqlite.py loader/merge_partitions.py loader/bootstrap.py loader/descriptions.py loader/deltas.py maintenance/loader/
          # bootstrap.py needs FRESH_CLAUSE and category_of() so its
          # first page matches what /api/jobs would return exactly.
          cp api/job_filters.py maintenance/
          cp db/schema.sql maintenance/db/
          cp alerts.py api/job_filters.py maintenance/
          pip install --target maintenance requests
          cd maintenance && zip -r ../scrape-maintenance.zip . -x "__pycache__/*" && cd ..

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SCRAPE_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update scrape-fast Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.SCRAPE_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://scrape-fast.zip
          aws lambda wait function-updated \
            --function-name ${{ vars.SCRAPE_LAMBDA_FUNCTION_NAME }}

      - name: Update scrape-workday Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.SCRAPE_WORKDAY_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://scrape-workday.zip
          aws lambda wait function-updated \
            --function-name ${{ vars.SCRAPE_WORKDAY_LAMBDA_FUNCTION_NAME }}

      - name: Update scrape-maintenance Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.SCRAPE_MAINTENANCE_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://scrape-maintenance.zip
          aws lambda wait function-updated \
            --function-name ${{ vars.SCRAPE_MAINTENANCE_LAMBDA_FUNCTION_NAME }}
