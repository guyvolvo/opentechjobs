name: merge-discovered-companies

# Continuously drains pending-discovery-candidates.json (populated and
# kept topped up by discover-companies.yml / refresh_discovery_queue.py,
# not a one-time snapshot) into domains.txt, staged instead of all at
# once.
#
# Why staged, not a single bulk merge: adding companies wholesale grows
# what the fast-poll Lambda checks every 5 minutes -- the exact kind of
# growth that made Workday need its own dedicated Lambda after it
# quietly ran the shared connection pool out of budget. Every run checks
# the fast-poll's own most recent real CloudWatch Duration first
# (merge_discovered_batch.py) and skips the batch entirely, queue
# untouched, if it's already using more than 70% of its 400s timeout --
# a real measurement each time, not a one-off guess trusted indefinitely.
#
# Tightened from */30 to */10 on 2026-09-08 now that the fast-poll has
# real proven headroom (2048->4096MB, 280->400s -- see
# infra/variables.tf's scrape_lambda_memory_mb/scrape_lambda_timeout_s)
# and BATCH_SIZE doubled 40->80: this doesn't merge any faster than the
# budget check above allows, it just checks more often, so a healthy
# fast-poll drains the queue sooner instead of waiting out an idle 30
# minutes it didn't need. Safe to run indefinitely, queue never dry for
# long: discover-companies.yml refills it daily, and an empty queue
# makes every run a no-op (see the script's own early exit), not an error.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: il-central-1

jobs:
  merge-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Merge one batch
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
        run: python merge_discovered_batch.py

      - name: Commit domains.txt + queue changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domains.txt pending-discovery-candidates.json
          git diff --cached --quiet && echo "nothing changed this run" && exit 0
          git commit -m "Merge one batch of discovered companies"
          git push
