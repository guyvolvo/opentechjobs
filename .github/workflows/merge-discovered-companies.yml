name: merge-discovered-companies

# Continuously drains pending-discovery-candidates.json (populated and
# kept topped up by discover-companies.yml / refresh_discovery_queue.py,
# not a one-time snapshot) into domains.txt, staged instead of all at
# once.
#
# Why staged, not a single bulk merge: adding companies wholesale grows
# what the fast-poll Lambda checks every 5 minutes -- the exact kind of
# growth that made Workday need its own dedicated Lambda after it
# quietly ran the shared connection pool out of budget. Every run checks
# the fast-poll's own most recent real CloudWatch Duration first
# (merge_discovered_batch.py) and skips the batch entirely, queue
# untouched, if it's already using more than 70% of its 400s timeout --
# a real measurement each time, not a one-off guess trusted indefinitely.
#
# No schedule: trigger here -- confirmed live 2026-09-08 that GitHub's
# own cron scheduler doesn't reliably fire on this repo (this workflow's
# cron sat stale for ~5 hours despite being set to */10; scrape-fast.yml
# hit the exact same thing earlier, see scrape_handler.py's own
# docstring). infra/dispatch_workflow_lambda.tf's EventBridge rule now
# calls workflow_dispatch below every 10 minutes instead, the same way a
# manual `gh workflow run` already did -- something with a real SLA
# triggering the work, not GitHub's own unreliable scheduler.
#
# BATCH_SIZE doubled 40->80 the same day, now that the fast-poll has
# real proven headroom -- this doesn't merge any faster than the budget
# check above allows, it just lets a healthy fast-poll drain the queue
# sooner instead of waiting out a smaller batch it didn't need to.
#
# concurrency below: confirmed live the same day -- the EventBridge
# dispatcher firing every 10 minutes plus a manual test trigger 18
# seconds apart produced two overlapping runs that both read the same
# 80 candidates off the front of the queue before either could write
# its own pop back. Harmless that time only because both happened to
# fail on the same widened-but-still-too-short probe.py timeout before
# reaching the commit step -- a faster success on one side would have
# let both push conflicting queue states. Queue instead of cancel: a
# genuinely-in-progress batch's real work shouldn't be thrown away for
# a newer trigger that can just wait its turn.

on:
  workflow_dispatch: {}

concurrency:
  group: merge-discovered-companies
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: il-central-1

jobs:
  merge-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Merge one batch
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
        run: python merge_discovered_batch.py

      - name: Commit domains.txt + queue changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domains.txt pending-discovery-candidates.json
          git diff --cached --quiet && echo "nothing changed this run" && exit 0
          git commit -m "Merge one batch of discovered companies"
          git push
