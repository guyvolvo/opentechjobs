name: scrape-fast

# The FAST path: re-poll every already-known (domain, ats, token)
# directly, one API call each, no guessing. Measured locally: ~4s for
# 123 companies vs. ~15 min for the full discovery pipeline over the same
# list; that gap is why this exists as a separate workflow.
#
# Every 10 minutes: GitHub Actions minutes are free on a public repo,
# so the constraint is politeness to the ATS APIs, not CI budget.
#
# known.json comes from S3, whatever scrape-discover.yml (or a previous
# run of this workflow) last derived. If it doesn't exist yet (before the
# first scrape-discover.yml run), this workflow exits early instead of
# erroring.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: il-central-1

jobs:
  fast-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download known.json
        id: known
        run: |
          if aws s3 cp "s3://${{ vars.DATA_BUCKET }}/known.json" known.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-poll known companies
        if: steps.known.outputs.exists == 'true'
        run: python probe.py --known known.json --json > resolved.json

      - name: Report
        if: steps.known.outputs.exists == 'true'
        run: |
          python -c "
          import json
          data = json.load(open('resolved.json', encoding='utf-8'))
          hits = [r for r in data if r.get('ats')]
          errors = [r['domain'] for r in data if r.get('error')]
          print(f'{len(hits)}/{len(data)} re-verified, {sum(r[\"job_count\"] for r in hits)} jobs')
          if errors:
              print(f'{len(errors)} known boards failed to re-poll: {errors}')
          "

      - name: Upsert into jobs.db, re-derive known.json, push both to S3
        if: steps.known.outputs.exists == 'true'
        run: |
          python loader/load_to_sqlite.py \
            --resolved resolved.json \
            --out jobs.db \
            --bucket ${{ vars.DATA_BUCKET }} \
            --key jobs.db
